# Netlify publica la carpeta netlify/ tal cual; no hay paso de compilación.
[build]
  publish = "netlify"
  command = ""

[[headers]]
  for = "/lecciones.js"
  [headers.values]
    Cache-Control = "no-cache"

# El service worker siempre debe revisarse para que el teléfono detecte versiones nuevas.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
